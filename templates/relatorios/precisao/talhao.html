<div class="talhao">
  <div class="talhao-header">
    <span class="talhao-header-name">{{ plot.name }}</span>
    <span class="talhao-header-badge">{{ plot.growth_stage }}</span>
  </div>
  <div class="talhao-body">
    <div class="talhao-info">
      <div>
        <div class="info-label">Área</div>
        <div class="info-value">{{ plot.area }}ha</div>
      </div>
      <div>
        <div class="info-label">Cultura</div>
        <div class="info-value">{{ plot.crop }}</div>
      </div>
      <div>
        <div class="info-label">Variedade</div>
        <div class="info-value">{{ plot.variety }}</div>
      </div>
      <div>
        <div class="info-label">Estádio Fenológico</div>
        <div class="info-value">{{ plot.growth_stage }}</div>
      </div>
      <div>
        <div class="info-label">DAP</div>
        <div class="info-value">{{ plot.dap or '—' }}</div>
      </div>
      <div>
        <div class="info-label">DAE</div>
        <div class="info-value">{{ plot.dae or '—' }}</div>
      </div>
    </div>

    <div class="images-and-assessment-group">
      <div class="image-gallery">
        {% for image in plot.images %}
          <div class="gallery-image-wrapper">
            <img src="{{ image.url }}" alt="{{ image.description }}" class="gallery-image" loading="eager" decoding="async" style="max-width:100%;height:auto;display:block;" onerror="this.style.display='none'" />
          </div>
        {% endfor %}
      </div>

      <div class="avaliacao">
        <div class="info-label mb-1">Avaliação</div>
        <div>{{ plot.assessment | safe }}</div>
      </div>
    </div>
  </div>
</div>
