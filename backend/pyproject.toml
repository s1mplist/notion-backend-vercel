[project]
name = "notion-backend-vercel"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "jinja2>=3.1.6",
    "notion-client>=2.5.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "aiohttp>=3.13.1",
    "httpx>=0.27.0",
    "psutil>=7.1.2",
    "pillow>=12.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.7",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.1",
    "uvicorn>=0.38.0",
    "vulture>=2.14",
]
tests = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "COM8",# jinja2 linting
]
ignore = [
    "E203",
    "E501",
    "COM812",
    "ISC001",
    "UP006",
    "UP035"

]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["notion_backend_vercel"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
